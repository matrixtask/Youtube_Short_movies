# このチャンネルの実運用設定（秘密情報なし・コミットOK）。
# クラウド実行（GitHub Actions）もローカルもこのファイルを読む。
# 全項目の説明は config.example.yaml を参照。

channel_concept: "中井佑の、とにかく早く移動したい！"

# 編集テイストの指示（お任せ初期版。参考動画が決まったら上書きして育てる）
style_notes: |
  - テンポ最優先。前置き・言い訳は切って、結論やオチに最短で届くカット割りにする
  - 字幕は話し言葉のまま短く。数字・時間・固有名詞は字幕でハッキリ立たせる
  - ツッコミは明るく軽め（辛口にしすぎない）。1本に1〜2回、笑いどころと強調ポイントに
  - フックは「移動・スピード・渋滞へのイライラ」への共感か、意外な数字で引く
  - 挿絵は乗り物・道路・地図・時計・空など「移動」のモチーフを優先。明るくポップに
  - タイトルは疑問形か数字入りで。説明的な体言止めは避ける

# 帯・文字色（スピード感のあるダークネイビー×イエロー）
band_color: "#0B1F3A"
title_color: "#FFFFFF"
hook_color: "#FFE600"
tsukkomi_color: "#FFD700"

# 横型撮影 → ショートは横幅フィット+上下帯（上帯にタイトル常時表示）
# 16:9ワイド版も同時生成（まとめ・ロング用）
shorts_layout: fit
wide_enabled: true
