# 投稿時刻が来た承認済みショートをYouTubeへ自動投稿する。
# 起動: GASのyoutubeTick（毎時、投稿予定があるときだけ）+ 毎時の保険 + 手動。
#
# 必要な Secrets（process-videos の4つに加えて）:
#   YT_CLIENT_ID       Google CloudのOAuthクライアントID
#   YT_CLIENT_SECRET   同クライアントシークレット
#   YT_REFRESH_TOKEN   youtube.upload スコープのリフレッシュトークン
name: publish

on:
  repository_dispatch:
    types: [publish-requested]
  schedule:
    - cron: '45 * * * *' # 毎時（dispatch取りこぼしの保険）
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -e ./pipeline

      - name: Publish due shorts to YouTube
        working-directory: pipeline
        run: ytshorts publish
        env:
          YTSHORTS_GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_ADMIN_TOKEN: ${{ secrets.GAS_ADMIN_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
