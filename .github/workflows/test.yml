name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Unit tests stub GPU/ffmpeg/API access; no production credentials required.
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Test pipeline
        working-directory: pipeline
        run: python -m pytest tests/ -q
      - name: Test GAS dashboard actions
        run: node --test gas/tests/dashboard.test.cjs
