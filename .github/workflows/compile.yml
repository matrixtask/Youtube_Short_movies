# 溜まったショートを1本のまとめ動画にする。
# 起動: Slackで「まとめて」（GAS → repository_dispatch）or GitHubのActionsタブから手動。
# 材料はSlack上のショート（GASの台帳から取得）、結果もSlackに投稿される。
name: compile

on:
  repository_dispatch:
    types: [compile-requested]
  workflow_dispatch:
    inputs:
      min_score:
        description: 'このスコア以上のショートだけまとめる'
        default: '0'
      limit:
        description: '本数上限（0=無制限、スコア上位から）'
        default: '0'

concurrency:
  group: compile
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install pipeline
        run: pip install -e ./pipeline

      - name: Compile shorts into one video
        working-directory: pipeline
        run: >
          ytshorts compile --from-slack
          --min-score "${{ github.event.inputs.min_score || '0' }}"
          --limit "${{ github.event.inputs.limit || '0' }}"
        env:
          YTSHORTS_GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_ADMIN_TOKEN: ${{ secrets.GAS_ADMIN_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
