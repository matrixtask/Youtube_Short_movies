# Slackに投げられた動画をクラウド上で編集してショートを量産する。
# 起動: GASからの repository_dispatch（動画が届いた瞬間）+ 毎時の保険 + 手動。
#
# 必要な Secrets（リポジトリの Settings > Secrets and variables > Actions）:
#   ANTHROPIC_API_KEY  Claude APIキー
#   GAS_WEBAPP_URL     GASのWebアプリURL
#   GAS_ADMIN_TOKEN    GASのADMIN_TOKENと同じ値
#   SLACK_BOT_TOKEN    Slackボットトークン（files:read / files:write / chat:write）
name: process-videos

on:
  repository_dispatch:
    types: [video-uploaded]
  schedule:
    - cron: '15 * * * *' # 毎時（dispatch取りこぼしの保険）
  workflow_dispatch:

concurrency:
  group: process-videos
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install ffmpeg and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk librsvg2-bin

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}
        env:
          WHISPER_MODEL: medium

      - name: Install pipeline
        run: pip install -e ./pipeline

      - name: Pull and process videos
        working-directory: pipeline
        run: ytshorts pull
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YTSHORTS_GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_ADMIN_TOKEN: ${{ secrets.GAS_ADMIN_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # GitHubランナーはCPUなので現実的な速度のモデルにする
          YTSHORTS_WHISPER_MODEL: medium
